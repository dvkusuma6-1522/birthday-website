<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Galaxy 🌌</title>

<style>

/* Background */

body{
margin:0;
font-family:"Comic Sans MS", cursive;
background:radial-gradient(circle at bottom,#020111 0%,#000000 100%);
color:white;
text-align:center;
overflow-x:hidden;
}

/* Moving stars */

.stars{
position:absolute;
width:100%;
height:100%;
background:url("https://www.transparenttextures.com/patterns/stardust.png");
animation:moveStars 60s linear infinite;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:10000px 5000px;}
}

/* Title */

h1{
margin-top:80px;
font-size:45px;
color:#7df9ff;
text-shadow:0 0 20px #00f7ff;
}

/* Gallery layout */

.gallery{
position:relative;
z-index:2;
display:flex;
justify-content:center;
gap:40px;
margin-top:80px;
flex-wrap:wrap;
}

/* Photo card */

.photo-card{
width:220px;
text-align:center;
}

/* Rectangular images */

.photo-card img{
width:220px;
height:160px;
object-fit:cover;
border-radius:15px;
box-shadow:0 0 20px #00f7ff;
transition:0.3s;
}

.photo-card img:hover{
transform:scale(1.1);
box-shadow:0 0 40px #00f7ff;
}

/* Message text */

.photo-card p{
margin-top:10px;
font-size:16px;
color:#ffffff;
}

/* Button */

button{
margin-top:60px;
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:#00f7ff;
cursor:pointer;
box-shadow:0 0 20px #00f7ff;
font-family:"Comic Sans MS", cursive;
}

button:hover{
transform:scale(1.1);
}

</style>
</head>

<body>

<div class="stars"></div>

<h1>Memory Galaxy 🌠</h1>

<div class="gallery">

<div class="photo-card">
<img src="photo1.jpeg">
<p>Boii has really grownn to Man now hehe 😂</p>
</div>

<div class="photo-card">
<img src="photo2.jpeg">
<p>Here u gooo I gotta a 1st pic with u hehe  🌟</p>
</div>

<div class="photo-card">
<img src="photo3.jpeg">
<p>Dumbassss!! 💫</p>
</div>

</div>

<button onclick="nextPage()">Come cut the cake hehe ⭐</button>

<script>

setTimeout(function(){

window.location.href="cake.html";

},1500);

</script>

</body>
</html>
