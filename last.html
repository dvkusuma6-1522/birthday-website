<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Final Orbit 🌌</title>

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:black;
font-family:"Comic Sans MS", cursive;
color:white;
text-align:center;
}

/* Galaxy Vortex */
.vortex{
position:absolute;
width:2000px;
height:2000px;
background:radial-gradient(circle, #ff00cc 0%, #330066 40%, #000000 70%);
border-radius:50%;
animation:spin 40s linear infinite;
z-index:-2;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* Glow Center */
.center-glow{
position:absolute;
width:400px;
height:400px;
background:radial-gradient(circle, white 0%, transparent 70%);
border-radius:50%;
z-index:-1;
opacity:0.3;
animation:pulse 3s infinite alternate;
}

@keyframes pulse{
from{opacity:0.2;}
to{opacity:0.6;}
}

h1{
font-size:3rem;
text-shadow:0 0 30px #ff00ff;
animation:fadeIn 3s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

.message{
font-size:1.4rem;
margin-top:20px;
max-width:600px;
line-height:1.7;
}

.btn{
margin-top:40px;
padding:15px 40px;
border:none;
border-radius:40px;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
font-size:1.2rem;
cursor:pointer;
transition:0.4s;
}

.btn:hover{
transform:scale(1.15);
box-shadow:0 0 40px #ff00ff;
}
</style>
</head>

<body>

<div class="vortex"></div>
<div class="center-glow"></div>

<h1>🌌 See You Next Orbit</h1>

<div class="message">
Another year completed.  
Another level unlocked.  
Keep lifting. Keep glowing. Keep evolving. 💪✨  
The universe is watching your gains.
</div>

<button class="btn" onclick="location.href='message.html'">
🔄 Restart Journey
</button>

</body>
</html>
